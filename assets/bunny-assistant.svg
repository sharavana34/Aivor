<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" fill="none" role="img" aria-labelledby="bunnyTitle">
  <title id="bunnyTitle">AIVOR trading buddy bunny</title>
  <defs>
    <radialGradient id="fur" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F4F7FB"/>
      <stop offset="100%" stop-color="#D8DEE9"/>
    </radialGradient>
    <radialGradient id="earIn" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#B8EFFF"/>
      <stop offset="100%" stop-color="#7AD4F5"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB4C8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FFB4C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4DD4FF"/>
      <stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
  </defs>

  <!-- Body (small under oversized head) -->
  <g class="bunny-body">
    <ellipse cx="80" cy="138" rx="38" ry="30" fill="url(#fur)"/>
    <ellipse cx="80" cy="142" rx="22" ry="14" fill="#EEF3F8" opacity=".9"/>
    <circle cx="80" cy="138" r="5" fill="url(#accent)" opacity=".85"/>
  </g>

  <!-- Feet -->
  <g class="bunny-feet">
    <ellipse cx="62" cy="164" rx="16" ry="9" fill="#F0F4F8"/>
    <ellipse cx="98" cy="164" rx="16" ry="9" fill="#F0F4F8"/>
    <ellipse cx="62" cy="164" rx="8" ry="4" fill="#CFE8F5" opacity=".7"/>
    <ellipse cx="98" cy="164" rx="8" ry="4" fill="#CFE8F5" opacity=".7"/>
  </g>

  <!-- Arms -->
  <g class="bunny-arms">
    <ellipse cx="44" cy="136" rx="11" ry="16" fill="url(#fur)" transform="rotate(-18 44 136)"/>
    <ellipse cx="116" cy="136" rx="11" ry="16" fill="url(#fur)" transform="rotate(18 116 136)"/>
  </g>

  <!-- Head group -->
  <g class="bunny-head">
    <!-- Ears (pivot near base) -->
    <g class="bunny-ear bunny-ear-l" style="transform-origin: 52px 78px">
      <ellipse cx="48" cy="36" rx="16" ry="42" fill="url(#fur)"/>
      <ellipse cx="48" cy="40" rx="8" ry="28" fill="url(#earIn)" opacity=".9"/>
    </g>
    <g class="bunny-ear bunny-ear-r" style="transform-origin: 108px 78px">
      <ellipse cx="112" cy="36" rx="16" ry="42" fill="url(#fur)"/>
      <ellipse cx="112" cy="40" rx="8" ry="28" fill="url(#earIn)" opacity=".9"/>
    </g>

    <!-- Face -->
    <ellipse class="bunny-face" cx="80" cy="96" rx="52" ry="48" fill="url(#fur)"/>
    <ellipse cx="48" cy="108" rx="12" ry="8" fill="url(#cheek)"/>
    <ellipse cx="112" cy="108" rx="12" ry="8" fill="url(#cheek)"/>

    <!-- Eyes -->
    <g class="bunny-eye bunny-eye-l">
      <ellipse cx="58" cy="92" rx="13" ry="15" fill="#FFFFFF"/>
      <ellipse class="bunny-pupil" cx="60" cy="94" rx="8" ry="9" fill="#1E88E5"/>
      <ellipse class="bunny-pupil-shine" cx="56" cy="90" rx="3" ry="3.5" fill="#E8F9FF"/>
      <rect class="bunny-lid" x="44" y="76" width="28" height="16" rx="8" fill="url(#fur)" opacity="0"/>
    </g>
    <g class="bunny-eye bunny-eye-r">
      <ellipse cx="102" cy="92" rx="13" ry="15" fill="#FFFFFF"/>
      <ellipse class="bunny-pupil" cx="104" cy="94" rx="8" ry="9" fill="#1E88E5"/>
      <ellipse class="bunny-pupil-shine" cx="100" cy="90" rx="3" ry="3.5" fill="#E8F9FF"/>
      <rect class="bunny-lid" x="88" y="76" width="28" height="16" rx="8" fill="url(#fur)" opacity="0"/>
    </g>

    <!-- Nose + smile -->
    <ellipse class="bunny-nose" cx="80" cy="108" rx="5" ry="3.5" fill="#5A6A7A"/>
    <path class="bunny-smile" d="M68 116 Q80 126 92 116" stroke="#5A6A7A" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Soft accent tuft -->
    <circle cx="80" cy="58" r="4" fill="url(#accent)" opacity=".55"/>
  </g>
</svg>
